name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Main gate: typecheck, the documented CLIs, every suite, documentation counts.
  # ---------------------------------------------------------------------------
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    # A hung install/test must fail the gate instead of occupying a runner for
    # GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # Pinned to the v4.4.0 commit: a moved tag must not silently change what
        # code runs with a read token. (Same pinning policy for every action.)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: `attest:verify` re-resolves the RECORDED commit (which
          # may be older than the checked-out tip) and the recorded base, and a
          # shallow clone would make a legitimate record unverifiable.
          fetch-depth: 0
          # CI only reads; never leave the token in .git/config where a later
          # step (or a compromised dependency script) could push with it.
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR-1: the content policy is read from the ATTESTED COMMIT
      # (`git check-attr --source`), never from the worktree. A blob that is not
      # plain LF text must be a declared `-text` exception in the committed
      # .gitattributes, otherwise its checkout bytes - and any digest over them -
      # are machine-dependent. This is the gate that would have caught ADR 0003's
      # CRLF appendix before it was published.
      - name: Check encoding and line-ending policy
        run: node scripts/eval/check-encoding-policy.mjs

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # P6 PR1 / R7: run the command users actually type, as a child process.
      # The ablation e2e suite imports the library and cannot catch a broken
      # entry point (that is how ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX slipped
      # through), so the documented CLI is exercised here directly - no pnpm
      # wrapper and no --experimental-* flag, exactly as documented.
      - name: Run default eval CLI
        run: node scripts/eval-jitrl.mjs --json

      # PR-1: the historical negative result is ASSERTED, not merely printed.
      # Before this, a drift away from the recorded -0.250 still exited 0.
      - name: Assert the historical negative result
        run: node scripts/eval/negative-result-diag.mjs --assert

      # PR-1: re-derive the COMMITTED attestation artifact from the object
      # database on this one runner. This answers "does the recorded evidence
      # still describe its commit?" (content authority, recorded base ancestry,
      # digest recipe, per-file blob/mode/bytes/encoding) and deliberately does
      # NOT claim cross-OS equality: that is measured by the separate
      # `fingerprint` / `fingerprint-parity` jobs, which recompute a FRESH
      # manifest on ubuntu, macos and windows and compare the three. The two
      # checks are complementary, not redundant: verify would still pass if the
      # digest were wrong on every platform in the same way, and parity would
      # still pass if the committed JSON were stale.
      - name: Verify the recorded commit attestation
        run: pnpm run attest:verify

      - name: Run tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: Verify README test counts and docs hygiene
        run: pnpm run check:docs

      # PR-1: `build` exiting 0 does not prove the bundle is importable. This
      # builds AND imports lib/index.js, then asserts the public surface.
      - name: Build and ESM-import smoke test
        run: node scripts/eval/smoke-build.mjs

  # ---------------------------------------------------------------------------
  # P0 (rev.4) evidence gates that no other job runs.
  #
  #   - `pnpm run guarded-regression` is ADR 0002 gate #7 (release-surface,
  #     isolation and trusted-source probes). It was a documented gate that CI
  #     never executed; wiring the package script makes the documented command
  #     and the CI command the same string.
  #   - the two `*.node-test.mjs` suites are deliberately OUTSIDE Vitest's glob
  #     (they run with plain `node --test`, so a third party can execute them
  #     with no dev dependencies). That is exactly why they need their own step:
  #     otherwise the parity `--expect-commit` rule and the attestation
  #     target/self-reference rules would be exercised on no runner at all.
  #
  # Deliberately NOT a `needs:` of `fingerprint`: a red probe must show up as
  # this job failing, not as the cross-OS evidence being skipped.
  # ---------------------------------------------------------------------------
  guarded-regression:
    name: Guarded regression and evidence rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Run guarded regression probes (ADR 0002 gate #7)"
        run: pnpm run guarded-regression

      # Both fixtures are self-contained (`os.tmpdir()` git repositories or
      # synthetic JSON directories), so this needs no repository history.
      - name: Run the parity and attestation node:test suites
        run: node --test scripts/eval/compare-platform-digests.node-test.mjs scripts/eval/final-attestation.node-test.mjs

  # ---------------------------------------------------------------------------
  # PR-1 cross-OS fingerprint job.
  #
  # The entire point of hashing the OBJECT DATABASE instead of the worktree is
  # that the digest is identical on every platform. That claim is worthless
  # unless it is measured on every supported platform, so this job recomputes
  # the same commit's attestation on Linux, macOS and Windows; the comparison
  # job fails if the three records differ (see `compare-platform-digests.mjs`).
  #
  # The comparison is published as a job summary so a reviewer reading the PR
  # sees the three digests side by side.
  # ---------------------------------------------------------------------------
  fingerprint:
    name: Cross-OS fingerprint (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The Windows leg also runs the PR-1 evidence tests, which check
          # `--base HEAD~1`; a depth-1 checkout would make that legitimately fail
          # through no fault of the code.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hash the COMMIT, never the checkout. The same commit id must produce the
      # same composite/binding digest on all three operating systems; if it does
      # not, the evidence is platform-dependent and cannot be published.
      # No shell redirection of --json: it is already printed to the job log, and
      # avoiding `>` sidesteps PowerShell's misleading default encodings on the
      # Windows runner. The artifact is the file the script writes with --out.
      - name: Compute commit attestation (raw blob bytes)
        # `--ref` already resolves the pushed revision, and `--expect-commit`
        # makes the target EXPLICIT: this platform must refuse to publish a
        # record for anything but the revision the workflow was triggered on.
        # The generated record is compared against `--expect-commit` again in
        # `fingerprint-parity`, so a wrong-commit artifact cannot slip through
        # as "three platforms agree".
        run: node scripts/eval/final-attestation.mjs --ref "${{ github.sha }}" --expect-commit "${{ github.sha }}" --out attestation.json --json

      - name: Publish this platform's digests
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const record = JSON.parse(fs.readFileSync(path.resolve("attestation.json"), "utf8"));
            console.log([
              "os=" + process.platform,
              "arch=" + process.arch,
              "commit=" + record.commit.commitId,
              "tree=" + record.commit.treeId,
              "files=" + record.fileCount,
              "composite=" + record.compositeSha256,
              "binding=" + record.bindingSha256
            ].join(" "));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "- `" + process.platform + "-" + process.arch + "`: composite `" + record.compositeSha256 +
              "`, binding `" + record.bindingSha256 + "`, " + record.fileCount + " files\n");
          '

      # PR-1 previously exercised the attestation on Windows but left the Windows
      # BUILD/IMPORT and evidence-test paths unmeasured, even though Windows was
      # where `smoke-build` once produced a false failure. Cover them here so the
      # matrix measures the claim instead of one happy path per OS.
      - name: Windows - build and ESM-import smoke test
        if: runner.os == 'Windows'
        run: node scripts/eval/smoke-build.mjs

      - name: Windows - PR-1 evidence gates and attestation tests
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/unit/p62/commit-attestation.test.ts tests/unit/p62/evidence-gates.test.ts

      - name: Record digest for the comparison job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attestation-${{ matrix.os }}
          path: attestation.json
          retention-days: 7
          # A missing record must fail here, not as a confusing "fewer than 3
          # platforms" message in the comparison job.
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The claim "the digest is identical on Windows, Linux and macOS" is only
  # evidence if something CHECKS it. This job downloads every platform's record
  # and runs the shipped comparison rule (`scripts/eval/compare-platform-digests.mjs`),
  # so the rule is the same code the unit suite tests - not an inline shell
  # snippet that no test can reach.
  # ---------------------------------------------------------------------------
  fingerprint-parity:
    name: Cross-OS fingerprint parity
    needs: fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download every platform's attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: attestation-*
          merge-multiple: false
          # A dedicated directory keeps the comparison input to exactly the three
          # records (the script scans subdirectories of its argument).
          path: artifacts

      - name: Compare digests across operating systems
        # `--expect-commit "${{ github.sha }}"` is what turns "the three records
        # agree" into "the three records agree on the revision this run was
        # triggered for": without it, three consistent records of the WRONG
        # commit (a stale artifact set) would pass.
        #
        # `shell: bash` gives the step `-o pipefail`, but that would abort before
        # the summary below is published; the explicit `PIPESTATUS[0]` capture
        # keeps BOTH properties - the JSON is always in the job summary, and the
        # rule's exit code (not `tee`'s) decides the job. The default shell would
        # report `tee`'s status, so a mismatch would have been published as a
        # green job.
        shell: bash
        run: |
          set +e
          node scripts/eval/compare-platform-digests.mjs artifacts --json \
            --expect-commit "${{ github.sha }}" \
            | tee parity.json
          status=${PIPESTATUS[0]}
          {
            echo "## Cross-OS fingerprint parity"
            echo '```json'
            cat parity.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # ---------------------------------------------------------------------------
  # P1 (ADR 0005 decision D1): the attestation-target gate.
  #
  # A committed attestation record can only describe the commit it was
  # generated FROM, so "which revision does this record cover" must be decided
  # PER COMMIT, not assumed:
  #   - an ordinary commit passes when the canonical record is self-consistent
  #     with its own commit AND that commit is an ancestor of HEAD; no parent
  #     binding is invented for ordinary commits (unconditional --strict would
  #     be always red, unconditional HEAD^1 would be a lax guess - both
  #     prototype-refuted in ADR 0005 §1.1/§8.2);
  #   - an evidence commit (trailer `Attestation-Target: first-parent`) must be
  #     record-only, non-merge, stacked on an UNMARKED parent, and its record
  #     must name exactly HEAD^1 - the target is DERIVED from the topology the
  #     commit declares, never guessed.
  #
  # Why a SEPARATE job (not a `verify` step): `fingerprint`/`fingerprint-parity`
  # are `needs: verify`; a target-gate failure inside `verify` would SKIP the
  # cross-OS evidence jobs. An independent job fails alone and the parity
  # evidence is still produced (same reasoning as `guarded-regression` above).
  # Why not `guarded-regression`: its checkout has no `fetch-depth: 0`, and a
  # shallow clone would misreport "missing history" as "bad evidence" - the
  # ordinary-commit rule needs real ancestry and the evidence rule needs
  # `HEAD^1`, so full history is REQUIRED here.
  #
  # Failure semantics: exit 1 with a stable reason code turns ONLY this job
  # red (no retry, no `|| true`, no pipeline). The `verify` job's
  # `attest:verify` keeps its historical self-consistency semantics untouched.
  # ---------------------------------------------------------------------------
  attestation-target:
    name: Attestation target binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The ordinary rule re-verifies ancestry (`merge-base --is-ancestor`)
          # and the evidence rule resolves `HEAD^1`; a shallow clone would turn
          # missing history into a false gate failure.
          fetch-depth: 0
          # CI only reads; never leave the token in .git/config (same invariant
          # as every other job).
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate itself decides ordinary vs evidence from the commit; its exit
      # code is the only verdict. The T0-T8 rules are exercised by
      # `scripts/eval/final-attestation.node-test.mjs` (guarded-regression job).
      - name: Judge the attestation target binding of this revision
        run: node scripts/eval/check-attestation-target.mjs --json

  # ---------------------------------------------------------------------------
  # P1 (ADR 0005 decision D5, t8): the targeted mutation gate.
  #
  # Four discriminating test groups pin four real defects (R1-M1 provenance
  # expansion, R1-M2 unknown-scope fail-closed, R3-M1 winner private yardstick,
  # R3-M2 readLearningTarget gain fallback). A test whose verdict never changes
  # when the defect comes back is decoration, so this job REINTRODUCES each
  # defect and requires the pinned tests to go red:
  #   - the criterion is `must-red test NAMES subset-of actual red names`, never
  #     an equal red COUNT (P1 legitimately grows the suites; the observed count
  #     is recorded for t16 instead of being asserted);
  #   - the same throwaway copy must be all green BEFORE the mutation, so an
  #     environment failure can never be mistaken for a kill;
  #   - the copy's target-file sha256 must change, so a no-op mutation cannot
  #     claim a kill;
  #   - mutants are applied ONLY inside a temp copy under os.tmpdir() - never
  #     in this worktree: src/, tests/ and scripts/ are the attestation digest
  #     roots, and an interrupted in-place mutation would silently poison
  #     `pnpm run attest:verify`. The gate re-hashes the four target files in
  #     the repository afterwards and fails on any change.
  #
  # Why a SEPARATE job: a lost discriminator is its own failure signal, and
  # nothing here depends on `verify` (which would make a red mutation gate skip
  # or mask the cross-OS evidence jobs). No `needs:`, no retry, no `|| true` -
  # the script's exit code is the only verdict. It runs on Node 22 like the
  # documented gates; the gate spawns the repository's own vitest binary, so no
  # new (or heavy) dependency is installed for it.
  # ---------------------------------------------------------------------------
  mutation-gate:
    name: Mutation gate (ADR 0005 D5)
    runs-on: ubuntu-latest
    # Four baseline runs plus four mutant runs, each in a fresh copy; the
    # generous bound is a hang detector, not a budget.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The gate reads the worktree and runs tests inside a temp copy; it
          # never needs history, and CI only reads (same no-token invariant as
          # every other job here).
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The documented gate and the CI gate are the same command string; the
      # job fails when any pinned mutant survives.
      - name: Run the four targeted mutation gates
        run: pnpm run check:mutation

  # ---------------------------------------------------------------------------
  # P1 (ADR 0005 decision D5, t8): Node 24 compatibility.
  #
  # The project documents Node >= 20.19 and every published count comes from
  # Node 22, but the runtime target line must be MEASURED on Node 24 rather
  # than assumed. This leg installs Node 24 EXPLICITLY through actions/
  # setup-node - the runner's preinstalled node is never mistaken for the
  # tested version, and `node -v` is printed into the log so the job states
  # which runtime produced its verdict.
  #
  # Failure semantics: red here is a COMPATIBILITY finding. It does not rewrite
  # the Node 22 `verify` job's official counts or conclusions (README counts
  # stay Node 22 measurements), which is exactly why this job has no `needs:`
  # and nothing has `needs:` of it.
  #
  # Honesty boundary (ADR 0005 F-17): the development machine only has
  # Node v22.23.1, so "Node 24 passes" can only ever be asserted from THIS
  # job's run log after a push - never from a local claim.
  # ---------------------------------------------------------------------------
  node24-compat:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the unit suites this job runs include the PR-1
          # evidence tests, which resolve `HEAD~1` and the frozen pre-policy
          # baseline commit (`84a3d828...`). On a shallow clone those
          # legitimate tests fail with "Not a valid object name" / "Needed a
          # single revision", which reports a CHECKOUT defect as a Node 24
          # incompatibility. History is REQUIRED here, exactly as in `verify`
          # and `attestation-target`.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '11.7.0'

      # Explicit version installation, never the runner default: the whole
      # point of the job is that the toolchain under test is Node 24.
      - name: Set up Node.js 24 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Print the Node version actually under test
        run: node -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the unit suites on Node 24
        run: pnpm exec vitest run tests/unit

      - name: Run default eval CLI
        run: node scripts/eval-jitrl.mjs --json

      - name: Assert the historical negative result
        run: node scripts/eval/negative-result-diag.mjs --assert