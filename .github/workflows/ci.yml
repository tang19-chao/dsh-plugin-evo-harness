name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Set up Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # P6 PR1 / R7: run the command users actually type, as a child process.
      # The ablation e2e suite imports the library and cannot catch a broken
      # entry point (that is how ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX slipped
      # through), so the documented CLI is exercised here directly - no pnpm
      # wrapper and no --experimental-* flag, exactly as documented.
      - name: Run default eval CLI
        run: node scripts/eval-jitrl.mjs --json

      - name: Run tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: Verify README test counts and docs hygiene
        run: pnpm run check:docs
